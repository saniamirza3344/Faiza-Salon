<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Aesthetic Salon by Faiza Jabeen logo</title>
  <defs>
    <path id="ringPathTop" d="M 18,82 A 62,62 0 0 1 142,82" />
    <path id="ringPathBottom" d="M 28,112 A 55,55 0 0 0 132,112" />
  </defs>

  <circle cx="80" cy="80" r="77" fill="#FFF8F5" stroke="#8B3A62" stroke-width="2"/>
  <circle cx="80" cy="80" r="68" fill="none" stroke="#C9A15B" stroke-width="1"/>

  <text font-family="'Cormorant Garamond', serif" font-size="11.5" letter-spacing="3" fill="#8B3A62">
    <textPath href="#ringPathTop" startOffset="50%" text-anchor="middle">AESTHETIC SALON</textPath>
  </text>

  <!-- Monogram: "A" with a soft feminine face-profile silhouette forming the right stroke -->
  <g transform="translate(80,80)">
    <path d="M -2,-30 L -22,28 L -13,28 L -7,10 L 9,10 L 13,-2 L -3,-2 Z" fill="#8B3A62"/>
    <path d="M 2,-30 C 10,-26 16,-16 18,-4 C 19,4 17,12 12,18 C 16,10 15,1 10,-6 C 6,-13 3,-18 6,-24
             C 9,-20 12,-13 12,-6 C 12,2 9,9 3,14 L 6,28 L 16,28 L 20,10 C 24,4 25,-4 23,-12
             C 21,-20 15,-27 2,-30 Z" fill="#8B3A62"/>
    <circle cx="16.5" cy="-19" r="1.6" fill="#FFF8F5"/>
  </g>

  <text font-family="'Jost', sans-serif" font-size="7.5" letter-spacing="1.2" fill="#C9A15B" text-anchor="middle">
    <textPath href="#ringPathBottom" startOffset="50%">BY FAIZA JABEEN</textPath>
  </text>
</svg>
